[package]
name = "cockpit-core"
description = "Calculations, data store and view model of the usage cockpit (no GUI code)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cockpit_core"

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
