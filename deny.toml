# SPDX-License-Identifier: Apache-2.0
#
# Allowed licences of the dependencies (concept section 12, REQ-107).
# Check: cargo deny check licenses
# The list of what is used is THIRD_PARTY_LICENSES.md, made by scripts/third-party-licenses.ps1
# (and scripts/third-party-licenses.sh) with cargo about and about.toml / about.hbs.

[graph]
# Platform specific dependencies are part of the check too.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
